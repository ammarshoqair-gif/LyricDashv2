name: LyricDash
options:
  bundleIdPrefix: com.ammar
  deploymentTarget:
    iOS: "18.0"
  # Turns the flat AppIcon.png into the icon folder Xcode expects.
  preGenCommand: "if [ -f make_assets.sh ]; then bash make_assets.sh; fi"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "2.0"
    CURRENT_PROJECT_VERSION: "3"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  LyricDash:
    type: application
    platform: iOS
    sources:
      - path: LyricDashApp.swift
      - path: ContentView.swift
      - path: SettingsView.swift
      - path: Theme.swift
      - path: LyricsEngine.swift
      - path: PlaybackClock.swift
      - path: LinePacer.swift
      - path: LocationKeepAlive.swift
      - path: KeepAlive.swift
      - path: LRCParser.swift
      - path: LyricsService.swift
      - path: LyricsAttributes.swift
      - path: Assets.xcassets
        optional: true
    info:
      path: AppInfo.plist
      properties:
        CFBundleDisplayName: LyricDash
        CFBundleShortVersionString: "2.0"
        CFBundleVersion: "3"
        UILaunchScreen: {}
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        NSAppleMusicUsageDescription: "LyricDash reads what's playing in Apple Music so it can show the lyrics."
        NSLocationWhenInUseUsageDescription: "LyricDash uses a low-power location session only to stay awake while your phone is locked, so lyrics keep moving. Your location is never saved or sent anywhere."
        NSLocationAlwaysAndWhenInUseUsageDescription: "LyricDash uses a low-power location session only to stay awake while your phone is locked, so lyrics keep moving. Your location is never saved or sent anywhere."
        UIBackgroundModes: [location, audio]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ammar.lyricdash
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: LyricDashWidget
  LyricDashWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: LyricDashWidget.swift
      - path: LyricsAttributes.swift
    info:
      path: WidgetInfo.plist
      properties:
        CFBundleDisplayName: LyricDash
        CFBundleShortVersionString: "2.0"
        CFBundleVersion: "3"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ammar.lyricdash.widget
schemes:
  LyricDash:
    build:
      targets:
        LyricDash: all
        LyricDashWidget: all
